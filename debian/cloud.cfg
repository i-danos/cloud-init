# The top level settings are used as module
# and system configuration.
# A set of users which may be applied and/or used by various modules
# when a 'default' entry is found it will reference the 'default_user'
# from the distro configuration specified below
users:
   - default


# If this is set, 'root' will not be able to ssh in and they
# will get a message to login instead as the default $user
disable_root: true

# This will cause the set+update hostname module to not operate (if true)
preserve_hostname: false

apt:
   # This prevents cloud-init from rewriting apt's sources.list file,
   # which has been a source of surprise.
   preserve_sources_list: true

# If you use datasource_list array, keep array items in a single line.
# If you use multi line array, ds-identify script won't read array items.
# Example datasource config
# datasource:
#    Ec2:
#      metadata_urls: [ 'blah.com' ]
#      timeout: 5 # (defaults to 50 seconds)
#      max_wait: 10 # (defaults to 120 seconds)




# The modules that run in the 'init' stage
cloud_init_modules:
 - seed_random
 - bootcmd
 - write-files
 - growpart
 - resizefs
 - disk_setup
 - mounts
 - update_etc_hosts
 - ca-certs
 - rsyslog
 - users-groups
 - ssh

# The modules that run in the 'config' stage
cloud_config_modules:
 # These four reach configd, so they cannot run in the init stage. Two reasons,
 # and only the first is fatal:
 #
 #  - cloud-init 25.x added cloud-init-network.service, which holds back
 #    sysinit.target until the network stage finishes. That stage runs
 #    cloud_init_modules, so a module there that waits on configd deadlocks the
 #    boot: configd starts at multi-user.target, which is after sysinit.target.
 #    ssh_vyatta waits, and the machine never reaches a login prompt.
 #
 #  - set_hostname and update_hostname do not wait, they just fail with
 #    "failed to connect to configd" and the hostname from the datasource is
 #    silently dropped. The vrouter distro sets it through configd as
 #    "system host-name" -- _write_hostname is a no-op -- so there is no
 #    /etc/hostname fallback.
 #
 # cloud-config.service is ordered After=config-loaded.target, which
 # system-configure.service reaches once the configuration is loaded, so configd
 # is up by then. This is also where 18.3-5vyatta9 had all four; the rebase moved
 # them into cloud_init_modules, where the 25.x handshake turned the first case
 # into a hang.
 - set_hostname
 - update_hostname
 - apply-network-vyatta
 - ssh_vyatta
 - snap
 - ssh-import-id
 - keyboard
 - locale
 - set-passwords
 - grub-dpkg
 - apt-pipelining
 - apt-configure
 - ntp
 - timezone
 - disable-ec2-metadata
 - runcmd
 - byobu

# The modules that run in the 'final' stage
cloud_final_modules:
 - package-update-upgrade-install
 - fan
 - landscape
 - lxd
 - write-files-deferred
 - puppet
 - chef
 - mcollective
 - salt-minion
 - reset_rmc
 - scripts-vendor
 - scripts-per-once
 - scripts-per-boot
 - scripts-per-instance
 - scripts-user
 - ssh-authkey-fingerprints
 - keys-to-console
 - install-hotplug
 - phone-home
 - final-message
 - power-state-change

# System and/or distro specific settings
# (not accessible to handlers/transforms)
system_info:
   # This will affect which distro class gets used
   distro: vrouter
   # Default user name + that default users groups (if added/used)
   default_user:
     name: tmpuser
     lock_passwd: True
     gecos: Temporary user
     groups: [adm, audio, cdrom, dialout, dip, floppy, netdev, plugdev, sudo, video]
     sudo: ["ALL=(ALL) NOPASSWD:ALL"]
     shell: /bin/bash
   # Other config here will be given to the distro class and/or path classes
   paths:
      cloud_dir: /var/lib/cloud/
      templates_dir: /etc/cloud/templates/
   package_mirrors:
     - arches: [default]
       failsafe:
         primary: https://deb.debian.org/debian
         security: https://deb.debian.org/debian-security
   ssh_svcname: ssh
